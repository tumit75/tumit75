  <linearGradient id="h-under" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="250" y2="0"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF6B4A"/></linearGradient>
  <radialGradient id="h-glow-a"><stop offset="0" stop-color="#FFB547" stop-opacity=".16"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
  <radialGradient id="h-glow-b"><stop offset="0" stop-color="#FF6B4A" stop-opacity=".12"/><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/></radialGradient>
  <pattern id="h-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#F3EEE6" fill-opacity=".05"/></pattern>
