><tspan fill="#FFB547">&quot;MERN&quot;</tspan><tspan fill="#A39E95">, </tspan><tspan fill="#FFB547">&quot;Next.js&quot;</tspan><tspan fill="#A39E95">, </tspan><tspan fill="#FFB547">&quot;WordPress&quot;</tspan><tspan fill="#A39E95">],</tspan></text></g><text x="652" y="198" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="12.5" text-anchor="end" fill="#6B6F7B">5</text><g class="a"><text class="h-ln" style="animation-delay:1.04s" x="698" y="198" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="13.5"><tspan fill="#E9D8B8">deploys</tspan><tspan fill="#A39E95">: [</tspan><tspan fill="#FFB547">&quot;Vercel&quot;</tspan><tspan fill="#A39E95">, </tspan><tspan fill="#FFB547">&quot;Netlify&quot;</tspan><tspan fill="#A39E95">, </tspan><tspan fill="#FFB547">&quot;Firebase&quot;</tspan><tspan fill="#A39E95">],</tspan></text></g><text x="652" y="220" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="12.5" text-anchor="end" fill="#6B6F7B">6</text><g class="a"><text class="h-ln" style="animation-delay:1.15s" x="698" y="220" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="13.5"><tspan fill="#E9D8B8">learning</tspan><tspan fill="#A39E95">: </tspan><tspan fill="#FFB547">&quot;backend security &amp; auth&quot;</tspan><tspan fill="#A39E95">,</tspan></text></g><text x="652" y="242" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="12.5" text-anchor="end" fill="#6B6F7B">7</text><g class="a"><text class="h-ln" style="animation-delay:1.26s" x="698" y="242" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="13.5"><tspan fill="#E9D8B8">education</tspan><tspan fill="#A39E95">: </tspan><tspan fill="#FFB547">&quot;CSE, final semester&quot;</ts