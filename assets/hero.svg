<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="h-title h-desc">
<title id="h-title">Tumit Hasan — Full Stack Developer</title>
<desc id="h-desc">Editor-style banner. Tumit Hasan, Full Stack Developer at Exprovia working with MERN, Next.js and WordPress. Based in Jashore, Khulna, Bangladesh. Open to collaborate.</desc>
<style>
@keyframes h-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes h-in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes h-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes h-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes h-drift-a{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,24px)}}
@keyframes h-drift-b{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-20px)}}
@keyframes h-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.8);opacity:0}}
@keyframes h-sheen{0%{transform:translateX(0)}55%,100%{transform:translateX(1500px)}}
.h-up{animation:h-up .8s cubic-bezier(.2,.7,.2,1) both}
.h-ln{animation:h-in .45s cubic-bezier(.2,.7,.2,1) both}
.h-draw{stroke-dasharray:1;animation:h-draw 1.2s cubic-bezier(.6,0,.2,1) .9s both}
.h-caret{animation:h-blink 1.05s step-end infinite}
.h-da{animation:h-drift-a 16s ease-in-out infinite}
.h-db{animation:h-drift-b 19s ease-in-out infinite}
.h-ping{transform-box:fill-box;transform-origin:center;animation:h-ping 1.8s ease-out infinite}
.h-sheen{animation:h-sheen 8s ease-in-out 2.5s infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}}</style>
<defs>
  <clipPath id="h-clip"><rect width="1200" height="420" rx="18"/></clipPath>
