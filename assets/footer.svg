<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="t d">
<title id="t">Thanks for stopping by</title>
<desc id="d">If you like my work, consider starring my repositories. Always open to collaborations, freelance gigs and learning opportunities. @tumit75 · Jashore, Bangladesh.</desc>
<style>
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.8);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fu{animation:fu .8s cubic-bezier(.2,.7,.2,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.drift{animation:drift 16s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}}
</style>
<defs>
<linearGradient id="tileG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101B33"/><stop offset="1" stop-color="#0A1122"/></linearGradient>
<linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<linearGradient id="edgeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"/><stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#3B82F6" stop-opacity=".38"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowC"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="gridP" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern></defs>
<g class="a"><g class="fu" style="animation-delay:0.00s">
<clipPath id="c29"><rect x="0" y="0" width="1200" height="176" rx="22"/></clipPath>
<rect x="0" y="0" width="1200" height="176" rx="22" fill="url(#tileG)"/>
<g clip-path="url(#c29)">
<rect width="1200" height="176" fill="url(#gridP)"/>
<g class="a"><g class="drift"><circle cx="1000" cy="0" r="320" fill="url(#glowB)"/></g></g>
<circle cx="150" cy="176" r="300" fill="url(#glowC)"/>
<text x="600" y="70" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5" fill="#EAF2FF">Thanks for stopping by!</text>
<text x="600" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#9AA8BF">If you like my work, consider starring my repositories.</text>
<text x="600" y="138" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#7486A3">Always open to collaborations, freelance gigs and learning opportunities.</text>
<rect x="0" y="171" width="1200" height="5" fill="url(#brandH)"/></g>
<rect x="0.5" y="0.5" width="1199" height="175" rx="21.5" fill="none" stroke="#1C2A4A"/>
<rect x="0.5" y="0.5" width="1199" height="175" rx="21.5" fill="none" stroke="url(#edgeG)"/>
</g></g>
</svg>
