<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="144" viewBox="0 0 1000 144" role="img" aria-labelledby="p2-t p2-d">
<title id="p2-t">GearUp</title>
<desc id="p2-d">Sports &amp; outdoor gear rental: book gear from verified local providers, pick your dates and pay securely. Built with Next.js, TypeScript, Express, Prisma, PostgreSQL, Stripe.</desc>
<style>
@keyframes p2-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.p2-up{animation:p2-up .7s cubic-bezier(.2,.7,.2,1) .1s both}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}}</style>
<defs>
  <clipPath id="p2-clip"><rect width="1000" height="144" rx="14"/></clipPath>
  <linearGradient id="p2-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF6B4A"/></linearGradient>
</defs>
<g clip-path="url(#p2-clip)">
  <rect width="1000" height="144" fill="#10131A"/>
  <rect width="3" height="144" fill="url(#p2-bar)"/>
  <text x="976" y="130" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="110" font-weight="800" text-anchor="end" fill="#F3EEE6" fill-opacity=".035">&lt;/&gt;</text>
  <g class="a"><g class="p2-up">
    <text x="26" y="45" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="13" font-weight="700" fill="#FFB547">02</text>
    <text x="60" y="46" font-family="'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#F3EEE6">GearUp</text>
    
    <text x="972" y="44" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="12" text-anchor="end" fill="#6B6F7B">tumit-h-r-75/gearup-frontend</text>
    <text x="60" y="78" font-family="'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A39E95">Sports &amp; outdoor gear rental: book gear from verified local providers, pick your dates and pay securely.</text>
