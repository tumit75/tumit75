<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18" role="presentation">
<style>
@keyframes thd-run{from{transform:translateX(0)}to{transform:translateX(1560px)}}
.thd-run{animation:thd-run 4.2s cubic-bezier(.5,0,.5,1) infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
<defs>
  <linearGradient id="thd-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9AE600" stop-opacity="0"/><stop offset=".5" stop-color="#9AE600" stop-opacity=".6"/><stop offset="1" stop-color="#9AE600" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="thd-streak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#BBF451" stop-opacity="0"/><stop offset=".5" stop-color="#BBF451" stop-opacity=".95"/><stop offset="1" stop-color="#BBF451" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0" y="8.5" width="1200" height="1" fill="url(#thd-line)"/>
<rect x="594" y="3" width="12" height="12" transform="rotate(45 600 9)" fill="none" stroke="#9AE600" stroke-width="1.2"/>
<rect x="597.5" y="6.5" width="5" height="5" transform="rotate(45 600 9)" fill="#9AE600"/>
<g class="a"><rect class="thd-run motion" x="-360" y="7.5" width="200" height="3" rx="1.5" fill="url(#thd-streak)"/></g>
</svg>
