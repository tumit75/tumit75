<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="thf-t">
<title id="thf-t">Tumit Hasan — designed and built with intention. Jashore, Bangladesh.</title>
<style>
@keyframes thf-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes thf-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes thf-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.thf-wave{stroke-dasharray:1;animation:thf-draw 2.4s cubic-bezier(.5,0,.2,1) .2s both}
.thf-in{animation:thf-rise .9s cubic-bezier(.2,.7,.2,1) .4s both}
.thf-caret{animation:thf-blink 1.1s step-end infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
<defs>
  <clipPath id="thf-clip"><rect width="1200" height="150" rx="20"/></clipPath>
  <linearGradient id="thf-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1217"/><stop offset="1" stop-color="#05090C"/></linearGradient>
  <linearGradient id="thf-wave-g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".3" stop-color="#22D3EE"/><stop offset=".7" stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="thf-glow"><stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <pattern id="thf-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#EEF6F8" stroke-opacity=".035" stroke-width=".6"/></pattern>
  <path id="thf-ekg-p" d="M-10 100 H330 L342 100 L350 90 L360 110 L372 80 L384 114 L394 100 H806 L818 100 L826 90 L836 110 L848 80 L860 114 L870 100 H1210"/>
</defs>
<g clip-path="url(#thf-clip)">
  <rect width="1200" height="150" fill="url(#thf-bg)"/>
  <rect width="1200" height="150" fill="url(#thf-grid)"/>
  <ellipse cx="600" cy="150" rx="420" ry="90" fill="url(#thf-glow)"/>
  <g class="a" fill="none">
    <path class="thf-wave" pathLength="1" d="M-10 100 H330 L342 100 L350 90 L360 110 L372 80 L384 114 L394 100 H806 L818 100 L826 90 L836 110 L848 80 L860 114 L870 100 H1210" stroke="url(#thf-wave-g)" stroke-width="1.4" stroke-linejoin="round" opacity=".6"/>
    <circle r="2.6" fill="#60A5FA" class="motion"><animateMotion dur="7s" begin="2.6s" repeatCount="indefinite"><mpath href="#thf-ekg-p"/></animateMotion></circle>
  </g>
  <g class="a"><g class="thf-in">
    <text x="600" y="58" text-anchor="middle" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="#EEF6F8">TUMIT HASAN</text>
    <text x="600" y="134" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11.5" letter-spacing="3" fill="#87A0A8"><tspan fill="#22D3EE">$</tspan> BUILT WITH INTENTION  ·  JASHORE, BANGLADESH</text>
  </g></g>
  <rect x="530" y="78" width="140" height="44" rx="10" fill="#05090C" stroke="#155E75"/>
  <text x="548" y="106" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#EEF6F8" textLength="84" lengthAdjust="spacing"><tspan fill="#22D3EE">&lt;/&gt;</tspan> exit 0</text>
  <g class="a"><rect class="thf-caret" x="638" y="91" width="9" height="18" fill="#22D3EE"/></g>
</g>
<rect x=".75" y=".75" width="1198.5" height="148.5" rx="19.5" fill="none" stroke="#172630" stroke-width="1.5"/>
</svg>
