<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="thx-title thx-desc">
<title id="thx-title">Tumit Hasan — Full Stack Developer</title>
<desc id="thx-desc">Animated banner. Tumit Hasan, Full Stack Developer working with MERN, Next.js and WordPress. Based in Jashore, Bangladesh. Open to collaborate.</desc>
<style>
@keyframes thx-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes thx-fade{from{opacity:0}to{opacity:1}}
@keyframes thx-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes thx-spin{to{transform:rotate(360deg)}}
@keyframes thx-spin-rev{to{transform:rotate(-360deg)}}
@keyframes thx-drift-a{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
@keyframes thx-drift-b{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-22px)}}
@keyframes thx-sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1700px)}}
@keyframes thx-scan{0%{transform:translateY(0)}70%,100%{transform:translateY(430px)}}
@keyframes thx-type{from{transform:translateX(-612px)}to{transform:none}}
@keyframes thx-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes thx-blip{0%{opacity:1;transform:scale(2.2)}10%{opacity:1;transform:scale(1)}70%,100%{opacity:.3;transform:scale(1)}}
@keyframes thx-pulse{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes thx-ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
@keyframes thx-shine{0%{stroke-dashoffset:.12}100%{stroke-dashoffset:-1.1}}
@keyframes thx-glitch-a{0%,88%,100%{opacity:0;transform:none}89%{opacity:.9;transform:translate(-6px,0)}91%{opacity:.7;transform:translate(5px,0)}93%{opacity:0}}
@keyframes thx-glitch-b{0%,89%,100%{opacity:0;transform:none}90%{opacity:.8;transform:translate(7px,0)}92%{opacity:.6;transform:translate(-4px,0)}94%{opacity:0}}
.thx-r1{animation:thx-rise .8s cubic-bezier(.2,.7,.2,1) .1s both}
.thx-r2{animation:thx-rise .9s cubic-bezier(.2,.7,.2,1) .3s both}
.thx-r4{animation:thx-fade 1s ease 3.2s both}
.thx-draw{stroke-dasharray:1;animation:thx-draw 1.4s cubic-bezier(.6,0,.2,1) .6s both}
.thx-shine{stroke-dasharray:.1 3;stroke-dashoffset:.12;animation:thx-shine 3.2s ease-in-out 2.2s infinite}
.thx-wave{stroke-dasharray:1;animation:thx-draw 2.6s cubic-bezier(.5,0,.2,1) .2s both}
.thx-type{animation:thx-type 2.1s steps(34,end) 1.3s both}
.thx-caret{animation:thx-blink 1s step-end infinite}
.thx-radar{transform-origin:975px 180px;animation:thx-spin 6s linear infinite}
.thx-sat{transform-origin:975px 180px;animation:thx-spin 14s linear infinite}
.thx-ticks{transform-origin:975px 180px;animation:thx-spin-rev 90s linear infinite}
.thx-hex{transform-origin:975px 180px;animation:thx-spin 24s linear infinite}
.thx-blip{transform-box:fill-box;transform-origin:center;animation:thx-blip 6s ease-out infinite}
.thx-da{animation:thx-drift-a 14s ease-in-out infinite}
.thx-db{animation:thx-drift-b 17s ease-in-out infinite}
.thx-sweep{animation:thx-sweep 9s ease-in-out 2.4s infinite}
.thx-scan{animation:thx-scan 7s ease-in-out 1.5s infinite}
.thx-pulse{stroke-dasharray:70 930;animation:thx-pulse 5.2s linear infinite}
.thx-ping{transform-box:fill-box;transform-origin:center;animation:thx-ping 1.8s ease-out infinite}
.thx-ga{animation:thx-glitch-a 7s steps(1,end) 3.5s infinite}
.thx-gb{animation:thx-glitch-b 7s steps(1,end) 3.5s infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
