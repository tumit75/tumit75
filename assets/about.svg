<title id="t">About Tumit Hasan</title>
<desc id="d">Full Stack Developer working across MERN, Next.js and WordPress to build performant, user-friendly web apps. 1+ year of professional experience at Exprovia. Custom React / Next.js apps, WordPress theme &amp; plugin customization, and full backend development. Motto: &quot;Never stop learning because life never stops teaching.&quot; Learning: Advanced backend security &amp; authentication. Deploys on: Firebase, Vercel &amp; Netlify. Off the keyboard: Playing cricket. Inspired by: Jhankar Mahbub &amp; Rasel Mridha (mentor &amp; friend). Experience: Full Stack Developer at Exprovia for 1+ year. Working on full-stack web development spanning MERN stack applications, Next.js projects and WordPress-based client solutions, contributing to real-world production builds and client-facing deliverables.</desc>
<style>
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.8);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fu{animation:fu .8s cubic-bezier(.2,.7,.2,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.drift{animation:drift 16s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}}
</style>
