<radialGradient id="glow"><stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EEF6F8" stop-opacity="0"/><stop offset=".5" stop-color="#EEF6F8" stop-opacity=".05"/><stop offset="1" stop-color="#EEF6F8" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect width="820" height="158" rx="14"/></clipPath></defs>
