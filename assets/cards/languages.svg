<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" role="img" aria-labelledby="t d">
<title id="t">Most Used Languages</title>
<desc id="d">Most used languages: TypeScript 94.4%, C# 2.8%, CSS 0.8%, Python 0.7%, JavaScript 0.6%, HTML 0.4%, PowerShell 0.4%.</desc>
<style>
@keyframes rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(1120px)}}
@keyframes seq{0%,100%{opacity:.25}30%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--off)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) .1s both}
.sweep{animation:sweep 8s ease-in-out 1s infinite}
.seq{animation:seq 1.5s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) .3s both}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1217"/><stop offset="1" stop-color="#05090C"/></linearGradient>
<pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EEF6F8" stroke-opacity=".035" stroke-width=".6"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EEF6F8" stop-opacity="0"/><stop offset=".5" stop-color="#EEF6F8" stop-opacity=".05"/><stop offset="1" stop-color="#EEF6F8" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect width="350" height="195" rx="14"/></clipPath></defs>
<g clip-path="url(#clip)">
  <rect width="350" height="195" fill="url(#bg)"/>
  <rect width="350" height="195" fill="url(#grid)"/>
  <circle cx="40" cy="30" r="195" fill="url(#glow)"/>
  
  <g class="a" transform="skewX(-18)"><rect class="sweep" x="-260" y="0" width="160" height="195" fill="url(#sheen)"/></g>
  <text x="25" y="36" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#22D3EE">Most Used Languages</text>
<clipPath id="lb"><rect x="25" y="52" width="300" height="8" rx="4"/></clipPath><g clip-path="url(#lb)"><rect x="25" y="52" width="300" height="8" fill="#172630"/><g class="a"><g class="grow"><rect x="25" y="52" width="283.3" height="8" fill="#3178c6"/><rect x="308.3" y="52" width="8.4" height="8" fill="#7355dd"/><rect x="316.7" y="52" width="2.3" height="8" fill="#663399"/><rect x="319" y="52" width="2" height="8" fill="#3572A5"/><rect x="321" y="52" width="1.8" height="8" fill="#f1e05a"/><rect x="322.8" y="52" width="1.2" height="8" fill="#e34c26"/><rect x="323.9" y="52" width="1.1" height="8" fill="#012456"/></g></g></g>
<g class="a"><g class="rise" style="animation-delay:0.20s"><circle cx="30" cy="84" r="5" fill="#3178c6"/><text x="41" y="88" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">TypeScript 94.4%</text></g></g><g class="a"><g class="rise" style="animation-delay:0.28s"><circle cx="185" cy="84" r="5" fill="#7355dd"/><text x="196" y="88" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">C# 2.8%</text></g></g><g class="a"><g class="rise" style="animation-delay:0.36s"><circle cx="30" cy="108" r="5" fill="#663399"/><text x="41" y="112" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">CSS 0.8%</text></g></g><g class="a"><g class="rise" style="animation-delay:0.44s"><circle cx="185" cy="108" r="5" fill="#3572A5"/><text x="196" y="112" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">Python 0.7%</text></g></g><g class="a"><g class="rise" style="animation-delay:0.52s"><circle cx="30" cy="132" r="5" fill="#f1e05a"/><text x="41" y="136" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">JavaScript 0.6%</text></g></g><g class="a"><g class="rise" style="animation-delay:0.60s"><circle cx="185" cy="132" r="5" fill="#e34c26"/><text x="196" y="136" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">HTML 0.4%</text></g></g><g class="a"><g class="rise" style="animation-delay:0.68s"><circle cx="30" cy="156" r="5" fill="#012456"/><text x="41" y="160" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#EEF6F8">PowerShell 0.4%</text></g></g>
</g>
<rect x=".6" y=".6" width="348.8" height="193.8" rx="13.4" fill="none" stroke="#172630" stroke-width="1.2"/>
</svg>
