  <rect width="1000" height="30" fill="#0B0D12"/>
  <rect width="180" height="30" fill="#10131A"/>
  <rect width="180" height="2" fill="url(#s03-brand)"/>
  <rect x="180" y="29.5" width="820" height="1" fill="#232836"/>
  <circle cx="20" cy="15.5" r="4" fill="#E9D8B8"/>
