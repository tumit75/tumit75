  <text x="162" y="20" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="13" text-anchor="middle" fill="#6B6F7B">×</text>
  <text x="980" y="20" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="11" text-anchor="end" fill="#6B6F7B">tumit75 › README.md › achievements</text>
  <g class="a" transform="skewX(-18)"><rect class="s03-sheen" x="-240" y="30" width="150" height="48" fill="url(#s03-sheen-g)"/></g>
  <g class="a"><g class="s03-in">
    <text x="24" y="62" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,'Courier New',monospace" font-size="15" font-weight="700" fill="#FFB547">03</text>
    <text x="62" y="63" font-family="'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#F3EEE6">Achievements</text>
  </g></g>
