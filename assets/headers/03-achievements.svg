<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="78" viewBox="0 0 1000 78" role="img" aria-labelledby="s03-t">
<title id="s03-t">03 — Achievements</title>
<style>
@keyframes s03-in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes s03-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes s03-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes s03-sheen{0%{transform:translateX(0)}55%,100%{transform:translateX(1300px)}}
.s03-in{animation:s03-in .7s cubic-bezier(.2,.7,.2,1) .1s both}
.s03-draw{stroke-dasharray:1;animation:s03-draw 1.2s cubic-bezier(.6,0,.2,1) .4s both}
.s03-ping{transform-box:fill-box;transform-origin:center;animation:s03-ping 2s ease-out infinite}
.s03-sheen{animation:s03-sheen 9s ease-in-out 1.5s infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}}</style>
<defs>
  <clipPath id="s03-clip"><rect width="1000" height="78" rx="14"/></clipPath>
  <linearGradient id="s03-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF6B4A"/></linearGradient>
  <linearGradient id="s03-ln" gradientUnits="userSpaceOnUse" x1="254" y1="0" x2="940" y2="0"><stop offset="0" stop-color="#FFB547" stop-opacity=".9"/><stop offset="1" stop-color="#FF6B4A" stop-opacity=".08"/></linearGradient>
  <linearGradient id="s03-sheen-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3EEE6" stop-opacity="0"/><stop offset=".5" stop-color="#F3EEE6" stop-opacity=".05"/><stop offset="1" stop-color="#F3EEE6" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#s03-clip)">
