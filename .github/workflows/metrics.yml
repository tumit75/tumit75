name: Generate Metrics Dashboard

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The dashboard needs a personal access token saved as the METRICS_TOKEN secret.
      # Until it is added, this job skips instead of failing every day.
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "METRICS_TOKEN secret is not set, skipping the metrics dashboard."
      - if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          # --- Base plugins ---
          plugin_calendar: yes
          plugin_languages: yes
          plugin_languages_analysis_timezone: Asia/Dhaka
          plugin_habits: yes
          plugin_achievements: yes
          config_timezone: Asia/Dhaka
