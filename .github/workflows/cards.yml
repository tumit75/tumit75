name: Update Profile Cards

on:
  schedule:
    - cron: "30 0 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/scripts/build-cards.mjs
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build cards
        run: node .github/scripts/build-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
      - name: Commit & push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets/cards
          git commit -m "Update profile cards" || exit 0
          git pull --rebase
          git push
