name: Generate Snake Animation

on:
  schedule:
    - cron: "0 1 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#EC4899&color_dots=#1C1535,#3B1D6B,#6D28D9,#A855F7,#F0ABFC
            dist/snake-light.svg?color_snake=#A855F7&color_dots=#EBEDF0,#E9D5FF,#C084FC,#9333EA,#6B21A8

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
