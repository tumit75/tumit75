name: Update Profile

on:
  schedule:
    - cron: "30 0 * * *"   # once a day, after the 3D graph job
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/profile/**
      - .github/scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build profile images
        run: node .github/scripts/build-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
      - name: Commit & push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets
          git commit -m "Update profile stats" || exit 0
          git pull --rebase
          git push
